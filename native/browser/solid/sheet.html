<!doctype html>
<!-- The Text sheet in the browser: src/renderer.ts, src/frame.ts and app/Sheet.tsx (440x564, twelve lines of the app's
     strings at eight sizes), bundled by `bun browser/solid/build.ts`; Clay runs in ui.wasm (browser/ui.c) through
     browser/solid/ffi-browser.ts and the frame is drawn by browser/draw.js. Nothing takes input: the page is static, and
     its frame is the text oracle's. Serve the repo root over HTTP (a browser refuses to fetch a .wasm from file://). -->
<meta charset="utf-8">
<title>cssints-native, the Text sheet, Solid in the browser</title>
<style>
  body { margin: 0; background: #0b0d12; color: #969baa; font: 13px/1.4 system-ui, sans-serif;
         display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 24px; }
  canvas { width: 440px; height: 564px; display: block; cursor: default; }
  .bar { display: flex; gap: 12px; align-items: center; }
</style>
<canvas id="frame" width="440" height="564" aria-label="The Text sheet: twelve lines of the app's strings at eight sizes, drawn from Clay's commands"></canvas>
<div class="bar">
  <span>the text sheet: the same lines, sizes and place as solid/frames/text-sheet.png</span>
  <span id="ms"></span>
</div>
<script type="module" src="sheet.js"></script>
