<!doctype html>
<!-- The Sky page in the browser: the desktop's Solid 2 renderer, src/frame.ts and app/Sky.tsx, bundled by
     `bun browser/solid/build.ts`; Clay runs in ui.wasm (browser/ui.c) through browser/solid/ffi-browser.ts and the frame —
     its commands and the effects beside them (gradients, groups, images, shadows) — is drawn by browser/draw.js, the same
     Canvas2D code as the no-JS page. Serve the repo root over HTTP (a browser refuses to fetch a .wasm from file://, and
     the avatars are the repo's own PNGs). -->
<meta charset="utf-8">
<title>cssints-native, Sky, Solid in the browser</title>
<style>
  body { margin: 0; background: #0b0d12; color: #969baa; font: 13px/1.4 system-ui, sans-serif;
         display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 24px; }
  canvas { width: 360px; height: 760px; display: block; cursor: default; touch-action: none; }
  .bar { display: flex; gap: 12px; align-items: center; }
</style>
<canvas id="frame" width="360" height="760" aria-label="The Sky page: Solid over Clay, drawn from Clay's commands and the renderer's tables"></canvas>
<div class="bar">
  <span>wheel the feed, Tab to the bar, the arrows switch feeds</span>
  <span id="ms"></span>
</div>
<script type="module" src="sky.js"></script>
