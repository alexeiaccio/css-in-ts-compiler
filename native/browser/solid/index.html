<!doctype html>
<!-- The Solid page in the browser: the desktop's Solid 2 renderer and the Sensors page (solid/src/renderer.ts,
     solid/src/frame.ts, solid/app/Sensors.tsx), bundled by `bun browser/solid/build.ts`; Clay runs in ui.wasm
     (browser/ui.c) through browser/solid/ffi-browser.ts and the frame is drawn by browser/draw.js — the same Canvas2D
     code as the no-JS page. Serve the repo root over HTTP (a browser refuses to fetch a .wasm from file://). -->
<meta charset="utf-8">
<title>cssints-native, Sensors, Solid in the browser</title>
<style>
  body { margin: 0; background: #0b0d12; color: #969baa; font: 13px/1.4 system-ui, sans-serif;
         display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 24px; }
  canvas { width: 360px; height: 360px; display: block; cursor: default; }
  .bar { display: flex; gap: 12px; align-items: center; }
</style>
<canvas id="frame" width="360" height="360" aria-label="The Sensors page: Solid over Clay, drawn from Clay's commands"></canvas>
<div class="bar">
  <span>click the pill, or press its mouse button</span>
  <span id="ms"></span>
</div>
<script type="module" src="page.js"></script>
