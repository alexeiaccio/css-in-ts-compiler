[package]
name = "lightningcss-napi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "generate-ast"
path = "src/bin/generate-ast.rs"
required-features = ["schema"]

[dependencies]
napi = { version = "3", features = ["serde-json"] }
napi-derive = "3"
lightningcss = { version = "1.0.0-alpha.71", features = ["serde", "visitor"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "0.8", features = ["smallvec", "indexmap2"], optional = true }

[features]
default = []
schema = ["schemars", "lightningcss/jsonschema"]

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
