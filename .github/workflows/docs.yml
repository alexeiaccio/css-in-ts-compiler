# The documentation site (apps/docs) on GitHub Pages: https://<owner>.github.io/<repo>/
# The build needs no package build: Vite bundles the tracked packages/*/dist, and the twoslash hovers type-check the ts blocks
# against packages/*/src.
name: docs

on:
  push:
    branches: [master]
    paths:
      - README.md
      - docs/**
      - apps/docs/**
      - packages/*/src/**
      - packages/*/dist/**
      - bun.lock
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # the site's plugin runs .ts files with node's type stripping
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build
        working-directory: apps/docs
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
