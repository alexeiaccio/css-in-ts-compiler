# Deploys apps/docs to Cloudflare (https://cssints.dev) with Alchemy on every push to master that can change it.
# Secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see apps/docs/README.md "Deploy"). The state is in the account
# (Cloudflare.state()), shared with local deploys. No package's dist/ is tracked, and Vite bundles it, so the packages
# are built first.
name: docs

on:
  push:
    branches: [master]
    paths:
      - README.md
      - docs/**
      - apps/docs/**
      - packages/*/src/**
      - bun.lock
      - .github/workflows/docs.yml
  workflow_dispatch:
    inputs:
      # sent by the site-hook relay (effects-of-atmosphere, apps/site-hook) when the pages in the PDS changed: what moved
      nudge:
        description: What changed in the CMS
        required: false
        type: string

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      # the docs plugin's worker runs .ts files with Node's type stripping
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # the apps import the built packages: their exports default to dist, src is the `development` condition
      - run: bun run build:packages
      - name: Deploy
        working-directory: apps/docs
        run: bun alchemy deploy --stage prod --yes
        env:
          CI: "true"
          # "pds" builds README.md and docs/API.md from the cssints PDS (apps/docs/plugin/pds.ts); unset is the files. A repository
          # variable, so the switch (and the way back) is not a commit.
          DOCS_SOURCE: ${{ vars.DOCS_SOURCE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
