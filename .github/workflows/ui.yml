# Checks the styled starters and the starter kit, and deploys ui.cssints.dev on master.
#
# The check job is what a release rests on: every starter's own conformance test in Chromium, then the starter template
# smoke test — copy `templates/solid-vite`, install it, add every item of `apps/ui/r` from a local server, run the copied
# tests and type-check the copy, then `add @cssints/switch` from the live registry last.
# Publishing the items themselves is `apps/registry-host` in effects-of-atmosphere (it needs the PDS credentials).
#
# Secrets for the deploy: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see apps/ui/README.md).
name: ui

on:
  push:
    branches: [master]
    paths:
      - apps/ui/**
      - templates/**
      - packages/headless/src/**
      - packages/headless/test/**
      - packages/headless/vite.config.ts
      # the engine the starter is compiled with: the plugin decides whether a package written on cssints is evaluated
      # or handed to Node, and the smoke is what catches it (0.37.0 made this job red from a plugin change)
      - packages/cssints/src/**
      - packages/apg-specs/src/**
      - packages/apg-specs/specs/**
      - packages/apg-specs/scenarios/**
      - packages/apg-specs/scripts/**
      - scripts/starter-smoke.mjs
      - .github/workflows/ui.yml
  pull_request:
    paths:
      - apps/ui/**
      - templates/**
      - packages/headless/src/**
      - packages/headless/test/**
      - packages/headless/vite.config.ts
      - packages/cssints/src/**
      - packages/apg-specs/src/**
      - packages/apg-specs/specs/**
      - packages/apg-specs/scenarios/**
      - packages/apg-specs/scripts/**
      - scripts/starter-smoke.mjs
      - .github/workflows/ui.yml
  workflow_dispatch:

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      # write, and only for the conformance results below: the smoke is what writes `public/r/*.result.json`,
      # so master commits them. Nothing else in this job pushes.
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # the app reads `cssints/vite` from the workspace's dist (AGENTS.md), so the packages are built first
      - run: bun run build:packages
      # the conformance walk needs a real browser — the one `apps/ui`'s pinned `playwright` drives. `bunx` from the
      # root has no local binary and would fetch npm's latest, whose browser revision the pinned runner cannot find
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/ui
      # the primitive's request/commit guard: one gesture is one intent, but a host that answers inside the gesture
      # moves the value, and the same request after it is the user's again. No other workflow runs
      # packages/headless's suite, and the native port's copy of this test goes with native/.
      - name: The headless primitives' request/commit guard
        working-directory: packages/headless
        run: bunx vp test run test/controllable.test.ts
      - name: The compiled theme is current
        working-directory: apps/ui
        run: bun run theme:check
      # The items are committed and the starter smoke test installs them, so an item that drifted from
      # its sources is tested in its old shape. Regenerate and format the way a person does, then require
      # the tree to be unchanged.
      - name: The registry items are current
        run: |
          bun apps/ui/scripts/registry-json.ts
          cd apps/ui && bunx vp fmt public/r public/llms.txt
          cd ../.. && git diff --exit-code -- apps/ui/public
      - name: The starters' own conformance
        working-directory: apps/ui
        run: bun run test
      - name: The starter kit, end to end
        run: bun scripts/starter-smoke.mjs
      # The smoke wrote the conformance record of every item it passed (`public/r/<name>.result.json`).
      # Master commits it, so the docs page shows a section about the files that are committed, not about
      # whoever released last; a pull request writes the files into its own checkout and stops there, since
      # a stale record hides the section instead of lying (the fingerprint is what decides). The write is
      # narrow: these files, an ordinary commit, and a GITHUB_TOKEN push starts no run of its own.
      - name: The conformance results are current
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'apps/ui/public/r/*.result.json'
          if git diff --cached --quiet; then
            echo "the results the smoke wrote are the ones committed"
            exit 0
          fi
          git commit -m "chore(ui): the conformance results the starter smoke wrote"
          # A merge can land while this job runs, and a plain push is then rejected (`fetch first`) — which is
          # how the first version of this step failed and left the deployed records behind. The files are
          # generated, so the fix is to replay them on the newest master and try again. A record that still
          # cannot be written is a warning, never a red gate: a stale record hides a section (the fingerprint
          # decides), it does not lie.
          for attempt in 1 2 3; do
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "master moved under the results (attempt $attempt); replaying on the new tip"
            sleep 5
            git fetch -q origin master
            git reset --soft origin/master
            git add -- 'apps/ui/public/r/*.result.json'
            if ! git diff --cached --quiet; then
              git commit -q -m "chore(ui): the conformance results the starter smoke wrote"
            fi
          done
          echo "::warning::the conformance results could not be committed; the next master run will write them"
          exit 0
      # the deploy builds the site from its own checkout, so this run's results travel to it: the record a
      # person reads is one deploy old otherwise
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          name: conformance-results
          path: apps/ui/public/r/*.result.json
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # the deploy builds the site here, and its config imports cssints/vite from the packages' dist
      - run: bun run build:packages
      # the results the check job's smoke wrote, into the tree the deploy builds
      - uses: actions/download-artifact@v8
        with:
          name: conformance-results
          path: apps/ui/public/r
      - name: Deploy
        working-directory: apps/ui
        run: bun alchemy deploy --stage prod --yes
        env:
          CI: "true"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
