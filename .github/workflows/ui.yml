# Checks the styled starters and the starter kit, and deploys ui.cssints.dev on master.
#
# The check job is what a release rests on: every starter's own conformance test in Chromium, then the starter template
# smoke test — copy `templates/solid-vite`, install it, add every item of `apps/ui/r` from a local server, run the copied
# tests and type-check the copy, then `add @cssints/switch` from the live registry last.
# Publishing the items themselves is `apps/registry-host` in effects-of-atmosphere (it needs the PDS credentials).
#
# Secrets for the deploy: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see apps/ui/README.md).
name: ui

on:
  push:
    branches: [master]
    paths:
      - apps/ui/**
      - templates/**
      - packages/headless/package.json
      - packages/headless/src/**
      - packages/headless/test/**
      - packages/headless/vite.config.ts
      # the engine the starter is compiled with: the plugin decides whether a package written on cssints is evaluated
      # or handed to Node, and the smoke is what catches it (0.37.0 made this job red from a plugin change)
      - packages/cssints/src/**
      - packages/apg-specs/src/**
      - packages/apg-specs/specs/**
      - packages/apg-specs/scenarios/**
      - packages/apg-specs/scripts/**
      - scripts/starter-smoke.mjs
      - .github/workflows/ui.yml
  pull_request:
    paths:
      - apps/ui/**
      - templates/**
      - packages/headless/package.json
      - packages/headless/src/**
      - packages/headless/test/**
      - packages/headless/vite.config.ts
      - packages/cssints/src/**
      - packages/apg-specs/src/**
      - packages/apg-specs/specs/**
      - packages/apg-specs/scenarios/**
      - packages/apg-specs/scripts/**
      - scripts/starter-smoke.mjs
      - .github/workflows/ui.yml
  workflow_dispatch:

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      # write, and only for the conformance results below: the smoke is what writes `public/r/*.result.json`,
      # so master commits them. Nothing else in this job pushes.
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # the app reads `cssints/vite` from the workspace's dist (AGENTS.md), so the packages are built first
      - run: bun run build:packages
      # the conformance walk needs a real browser — the one `apps/ui`'s pinned `playwright` drives. `bunx` from the
      # root has no local binary and would fetch npm's latest, whose browser revision the pinned runner cannot find
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/ui
      # The whole package, not one file: 77 browser test files — the differential walks against the Quint specs, the
      # ported scenario replays and the DOM oracles. This is the only workflow that runs any of them, so a primitive
      # that regresses otherwise lands green (a drawer lost its panel's tabindex that way). Chromium is the one
      # installed above: `apps/ui` pins the same `playwright` the package does, so it is the same revision.
      - name: The headless primitives' suite
        working-directory: packages/headless
        # ~2 min on a quiet machine and ~2 on a loaded one; a walk is bounded by steps, not wall time, and
        # `vite.config.ts` already raises a single test to 60 s.
        timeout-minutes: 12
        run: bun run test
      - name: The compiled theme is current
        working-directory: apps/ui
        run: bun run theme:check
      # A skin's two silent failures: a part selector nothing emits and a token nothing declares. Both render, and
      # both are dead CSS a reviewer reads as fine, so they are checked here before a directory becomes an item.
      - name: Every skin's parts and tokens resolve
        working-directory: apps/ui
        run: bun run skin:check
      # The smoke installs the *committed* items, so a drifted item would be tested in its old shape. Regenerate
      # and format the way a person does, and let the run continue on the fresh tree: the diff is no longer a
      # gate, because a generated file should never be a person's ritual — master commits it below (see the race
      # note there), and a pull request simply tests what its own sources produce.
      - name: The registry items follow their sources
        run: |
          bun apps/ui/scripts/registry-json.ts
          cd apps/ui && bunx vp fmt public/r public/llms.txt
      - name: The starters' own conformance
        working-directory: apps/ui
        run: bun run test
      # The site in Chrome: every page's story and its id, a control remounting it, the sink, the catalog and a screen.
      # It is also where Solid's dev-build relay diagnosis is caught — a primitive that keeps derived state in a signal
      # written by an effect answers a frame late (the site test fails on `EFFECT_RELAY_TEAR`).
      - name: The site in Chrome
        working-directory: apps/ui
        timeout-minutes: 15
        run: bun run test:site
      - name: The starter kit, end to end
        run: bun scripts/starter-smoke.mjs
      # The smoke wrote the conformance record of every item it passed (`public/r/<name>.result.json`).
      # Master commits it, so the docs page shows a section about the files that are committed, not about
      # whoever released last; a pull request writes the files into its own checkout and stops there, since
      # a stale record hides the section instead of lying (the fingerprint is what decides). The write is
      # narrow: these files, an ordinary commit, and a GITHUB_TOKEN push starts no run of its own.
      - name: The generated registry files are committed
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # the items the step above regenerated, and the records the smoke just wrote
          git add -- 'apps/ui/public/r/*.json'
          if git diff --cached --quiet; then
            echo "the items and records on disk are the committed ones"
            exit 0
          fi
          git commit -m "chore(ui): the registry items and the conformance records the smoke wrote"
          # A merge can land while this job runs, and a plain push is then rejected (`fetch first`) — which is
          # how the first version of this step failed and left the deployed records behind.
          #
          # The retry must NOT move this checkout's HEAD: its tree contains everything the run merged, so a
          # `git reset --soft origin/master` turns those commits into *staged reversals* and the next commit
          # deletes the merge — which is exactly what it did once (a bean commit and an AGENTS.md section gone,
          # a deleted scratch file back). Instead the generated files are staged onto master's tree in an index
          # of their own and committed with `commit-tree`, so the commit's parent is master and its tree is
          # master plus these files: nothing else can travel with it, whatever the checkout held.
          for attempt in 1 2 3; do
            git fetch -q origin master
            git read-tree origin/master
            git add -- 'apps/ui/public/r/*.json'
            if git diff-index --cached --quiet origin/master --; then
              echo "the generated files are the ones on master"
              exit 0
            fi
            tree="$(git write-tree)"
            commit="$(git commit-tree "$tree" -p origin/master -m "chore(ui): the registry items and the conformance records the smoke wrote")"
            if git push origin "$commit:master"; then
              exit 0
            fi
            echo "master moved under the generated files (attempt $attempt); staging them on the new tip"
            sleep 5
          done
          echo "::warning::the registry files could not be committed; the next master run will write them"
          exit 0
      # the deploy builds the site from its own checkout, so this run's results travel to it: the record a
      # person reads is one deploy old otherwise
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          name: conformance-results
          path: apps/ui/public/r/*.result.json
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # the deploy builds the site here, and its config imports cssints/vite from the packages' dist
      - run: bun run build:packages
      # the results the check job's smoke wrote, into the tree the deploy builds
      - uses: actions/download-artifact@v8
        with:
          name: conformance-results
          path: apps/ui/public/r
      - name: Deploy
        working-directory: apps/ui
        run: bun alchemy deploy --stage prod --yes
        env:
          CI: "true"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
