# A Version Packages pull request is stale in two ways, and scripts/version-pr-fresh.sh checks both: its tree still
# carries a changeset (cut before consuming it, or rebased onto a newer master), or a changeset landed on master after
# the PR was cut — which its tree cannot show, so the history is read. Merging a stale one publishes the older set,
# leaves the new changeset behind and the release workflow opens another version PR: 0.40.0 and 0.42.0 were committed,
# tagged and never published that way.
#
# `pull_request_target`, not `pull_request`: the version branch is written by `GITHUB_TOKEN`, and a `pull_request` run
# for it sits at `action_required` until a person approves it — so the check would never run for the one PR it is for.
# The target event runs in the base branch's context, and this job executes nothing from the PR: it fetches the head ref
# and reads its tree and history with git. The script itself comes from the base branch, so a PR cannot edit the check.
name: version PR

on:
  pull_request_target:
    branches: [master]

permissions: {}

jobs:
  fresh:
    if: startsWith(github.event.pull_request.head.ref, 'changeset-release/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      - name: The version PR is current
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch -q --no-tags origin master "+refs/pull/$PR_NUMBER/head:refs/remotes/pr/head"
          bash scripts/version-pr-fresh.sh origin/master refs/remotes/pr/head
