<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="cssints: compile-time CSS-in-TypeScript. The README and the API reference."
    />
    <title>cssints</title>
    <link rel="icon" href="%BASE_URL%logo.svg" type="image/svg+xml" />
    <!-- The stored settings, before the first paint (src/settings.ts apply()): no mode is "system". -->
    <script>
      (function () {
        var s = {},
          h = document.documentElement,
          o = {
            palette: [
              "cssints",
              "itten",
              "munsell",
              "albers",
              "radix",
              "flexoki",
              "open-props",
              "reasonable-colors",
            ],
            text: ["small", "large"],
            density: ["compact", "comfortable"],
            font: ["serif", "mono"],
            radius: ["sharp", "round"],
          };
        try {
          s = JSON.parse(localStorage.getItem("cssints-docs.settings")) || {};
        } catch (e) {}
        if (s.mode === "light") h.classList.add("light");
        if (s.mode === "dark" || s.mode === "dim") h.classList.add("dark");
        if (s.mode === "dim") h.classList.add("dim");
        for (var k in o) if (o[k].indexOf(s[k]) >= 0) h.dataset[k] = s[k];
        if (Number.isInteger(s.hue) && s.hue >= 0 && s.hue < 12) h.dataset.hue = "" + s.hue;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
